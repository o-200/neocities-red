name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby 4.0.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.0
          bundler-cache: true

      - name: Debug versions
        run: |
          ruby -v
          bundle exec rubocop -V

      - name: Run linter
        run: bundle exec rubocop

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby 4.0.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.0
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  freebsd:
    name: Test (freebsd-14.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lint and tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y ruby rubygem-bundler ca_root_nss
          run: |
            ruby -v
            bundle -v
            bundle config set frozen true
            bundle install
            bundle exec rubocop
            bundle exec rspec
