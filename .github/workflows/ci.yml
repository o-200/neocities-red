name: CI

on:
  push:
  pull_request:

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run linter
        run: bundle exec rubocop

      - name: Run tests
        run: bundle exec rspec